name: Publicar web en GitHub Pages

on:
  push:
    branches: ["claude/recipe-app-shopping-ticket-ng8q5o"]
  workflow_dispatch:

# Permisos que necesita el despliegue de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelar el que esté en curso.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar Pages (auto-activación)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Compilar web (subruta = ruta base de Pages)
        run: npm run build
        env:
          EXPO_OFFLINE: "1"
          # base_path lo calcula configure-pages a partir del nombre del repo
          # (p. ej. /recetas_ticket); así el bundle y los assets apuntan bien.
          APP_BASE_URL: ${{ steps.pages.outputs.base_path }}

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
