name: Publicar web en GitHub Pages

# Reconstruye la web en cada push a la rama y actualiza la rama gh-pages,
# que es la que GitHub Pages sirve. Usa el GITHUB_TOKEN (permiso de escritura
# de contenido), sin necesitar permisos de administración de Pages.

on:
  push:
    branches: ["claude/recipe-app-shopping-ticket-ng8q5o"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "deploy-gh-pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar web (subruta /recetas_ticket)
        run: npm run build
        env:
          EXPO_OFFLINE: "1"
          APP_BASE_URL: "/recetas_ticket"

      - name: Publicar en la rama gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy web ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
